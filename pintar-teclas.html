<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Luwipi · Pinta o piano</title><style>
:root{--ink:#24344e;--cream:#fffaf0;--gold:#f4bd58}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 3%,#ffe0e5,transparent 28%),radial-gradient(circle at 90% 20%,#d8f4ef,transparent 33%),#fff8e9}button{font:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #4185df;outline-offset:3px}.wrap{max-width:1060px;margin:auto;padding:16px 12px 40px}.head{display:flex;align-items:center;justify-content:space-between;margin:3px 3px 20px}.brand{font-size:24px;font-weight:950;letter-spacing:-1.5px}.brand b{color:#d89242}.badge{font-size:12px;font-weight:900;border-radius:99px;padding:8px 11px;background:#fff;color:#7b7683}.title{text-align:center;font-size:clamp(32px,7vw,53px);line-height:1.1;letter-spacing:-.06em;margin:9px 0 17px}.modes{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:17px}.mode{background:#fff;border:3px solid #e6e6e2;border-radius:18px;padding:10px 15px;min-width:123px;box-shadow:0 5px 0 #e9dfd1;font-weight:900;color:var(--ink)}.mode.on{border-color:#edac51;background:#fff6d9;box-shadow:0 5px 0 #dcae69}.mode-icon{display:block;font-size:18px;letter-spacing:3px;line-height:1.1;color:#27334a}.mode-label{display:block;font-size:13px;margin-top:4px}.game{border-radius:28px;background:#fff;border:3px solid #fff;box-shadow:0 20px 55px #24344e22;overflow:hidden}.challenge{display:flex;gap:15px;align-items:center;justify-content:center;flex-wrap:wrap;padding:16px 12px 10px}.challenge h2{font-size:clamp(23px,5vw,35px);margin:0;letter-spacing:-.04em}.challenge h2 em{font-style:normal;color:var(--goal)}.paint-icon{width:51px;height:51px;border-radius:17px;display:grid;place-items:center;background:var(--goal);font-size:26px;transform:rotate(-8deg);box-shadow:0 4px 0 #0002}.palette{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 12px 14px}.color{width:45px;height:45px;border:3px solid white;border-radius:50%;background:var(--color);box-shadow:0 3px 0 #0002,0 0 0 1px #0001}.color.on{box-shadow:0 0 0 3px #25334b,0 4px 0 #0002;transform:translateY(-3px)}.canvas-area{padding:13px 12px 8px;background:linear-gradient(#f4f9ff,#eef8f3);text-align:center}.instruction{font-size:14px;font-weight:850;color:#60738a;margin:0 0 13px}.keyboard-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-color:#b4c4d4 transparent;max-width:930px;margin:auto;padding:0 0 17px}.keyboard{--w:78px;--h:244px;--black:43px;position:relative;display:flex;width:max-content;height:calc(var(--h) + 14px);padding:0 4px 13px;background:#344055;border-radius:14px;box-shadow:0 9px 0 #202b3f,0 15px 22px #1d294337;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.white{width:var(--w);height:var(--h);flex:none;position:relative;background:linear-gradient(#fff,#fbfaf7 72%,#e9e7e2);border:1px solid #b7c0c7;border-bottom:8px solid #c7c9c9;border-radius:0 0 9px 9px}.white span{position:absolute;bottom:16px;left:0;right:0;font-weight:950;font-size:14px;z-index:7;pointer-events:none;color:#344359}.white small{display:block;font-size:10px;color:#8a929b}.black{position:absolute;top:0;width:var(--black);height:138px;transform:translateX(-50%);background:linear-gradient(90deg,#162238,#344057 52%,#111d30);border:2px solid #121e30;border-bottom:8px solid #121827;border-radius:0 0 7px 7px;z-index:6;box-shadow:2px 3px 5px #0005;pointer-events:none}.black:after{content:'';position:absolute;bottom:12px;left:8px;right:8px;height:3px;border-radius:9px;background:#ffffff4d}.paint-layer{position:absolute;inset:0 auto auto 0;z-index:4;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}.nav{display:flex;align-items:center;gap:12px;max-width:590px;margin:17px auto 6px}.nav[hidden]{display:none}.nav button{width:45px;height:41px;border-radius:13px;border:2px solid #b9d1d7;background:#fff;font-size:22px;font-weight:900}.nav input{min-width:80px;flex:1;accent-color:#ea9a5a}.status{min-height:31px;margin:12px 0 4px;font-size:25px;font-weight:900}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:#fffaf0}.dots{display:flex;gap:7px;align-items:center}.dot{width:16px;height:16px;border-radius:50%;background:#d8dfdf}.dot.done{background:#65c79b;box-shadow:0 0 0 3px #d7f2e5}.buttons{display:flex;gap:7px}.tool{border:0;border-radius:13px;background:#e9eef5;color:#33445c;padding:11px 14px;font-weight:900}.tool.next{background:#263c5c;color:#fff}.tool:disabled{opacity:.42}.foot{text-align:center;color:#84909b;font-size:12px;font-weight:750;margin:15px 0}@media(max-width:600px){.wrap{padding:9px 8px 30px}.head{margin-bottom:13px}.brand{font-size:21px}.badge{font-size:10px}.title{margin:7px 0 14px}.modes{gap:6px}.mode{min-width:0;flex:1;padding:9px 3px;border-radius:14px}.mode-icon{font-size:15px;letter-spacing:1px}.mode-label{font-size:11px}.game{border-radius:22px}.keyboard{--w:clamp(70px,25vw,86px)}.keyboard.full{--w:54px}.white span{font-size:12px}.black{width:35px}.color{width:40px;height:40px}.canvas-area{padding-inline:4px}.controls{padding:10px}.tool{font-size:12px;padding:10px}}
</style></head><body><main class="wrap"><header class="head"><div class="brand"><b>◖</b> luwipi</div><a class="badge" href="/aprenda/" style="text-decoration:none;color:#53647c">← Luwipi</a></header><h1 class="title">Pinta o piano!</h1><div class="modes" aria-label="Escolher teclado"><button class="mode on" data-mode="two"><span class="mode-icon">▪ ▪</span><span class="mode-label">2 pretas</span></button><button class="mode" data-mode="three"><span class="mode-icon">▪ ▪ ▪</span><span class="mode-label">3 pretas</span></button><button class="mode" data-mode="all"><span class="mode-icon">🎹</span><span class="mode-label">Piano todo</span></button></div><section class="game"><div class="challenge"><div class="paint-icon" id="paintIcon">🖌️</div><h2 id="goal"></h2></div><div class="palette" id="palette" aria-label="Tintas"></div><div class="canvas-area"><p class="instruction">🖌️ Arrasta o dedo para pintar!</p><div class="keyboard-scroll" id="scroller"><div class="keyboard" id="keyboard"><canvas class="paint-layer" id="paintLayer" aria-label="Área de pintura do teclado"></canvas></div></div><div class="nav" id="nav" hidden><button id="left" aria-label="Ir para a esquerda">←</button><input id="position" type="range" min="0" max="100" value="0" aria-label="Percorrer o piano"><button id="right" aria-label="Ir para a direita">→</button></div><div class="status" id="status" role="status" aria-live="polite">🎨</div></div><div class="controls"><div class="dots" id="dots" aria-label="Progresso"></div><div class="buttons"><button class="tool" id="clear" aria-label="Limpar pintura">🧽 Limpar</button><button class="tool next" id="next" disabled>Próxima ➜</button></div></div></section><div class="foot">Escolhe a tinta e pinta. As teclas pretas mostram onde estão as notas.</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),names=['Dó','Ré','Mi','Fá','Sol','Lá','Si'],pitches=[0,2,4,5,7,9,11],colors=[{id:'red',name:'vermelho',hex:'#f26870'},{id:'blue',name:'azul',hex:'#5ca3e8'},{id:'yellow',name:'amarelo',hex:'#f8cc52'},{id:'green',name:'verde',hex:'#6fcb92'},{id:'purple',name:'roxo',hex:'#a47bd9'},{id:'orange',name:'laranja',hex:'#f5a45d'},{id:'pink',name:'rosa',hex:'#e77cb4'}],tasks=[{n:0,color:'red'},{n:1,color:'blue'},{n:2,color:'yellow'},{n:3,color:'green'},{n:4,color:'purple'},{n:5,color:'orange'},{n:6,color:'pink'}];
let mode='two',index=0,selected='red',keys=[],whiteWidth=78,painted=new Map(),tracking=new Map(),audio=null,canvas=$('paintLayer'),ctx=canvas.getContext('2d');const keyboard=$('keyboard'),scroller=$('scroller');
function options(){return mode==='two'?tasks.slice(0,3):mode==='three'?tasks.slice(3):tasks}
function task(){return options()[index]}
function color(id){return colors.find(c=>c.id===id)}
function nameOf(midi){return pitches.indexOf(midi%12)}
function sound(midi){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=440*2**((midi-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.27);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.29)}catch{}}
function sequence(){if(mode==='two')return [60,62,64];if(mode==='three')return [65,67,69,71];const all=[];for(let midi=21;midi<=108;midi++)if(pitches.includes(midi%12))all.push(midi);return all}
function build(){tracking.clear();painted.clear();index=Math.min(index,options().length-1);keyboard.querySelectorAll('.white,.black').forEach(e=>e.remove());keyboard.classList.toggle('full',mode==='all');keys=[];const seq=sequence();for(let i=0;i<seq.length;i++){const midi=seq[i],key=document.createElement('div');key.className='white';key.dataset.midi=midi;key.innerHTML=`<span>${names[nameOf(midi)]}${mode==='all'?`<small>${Math.floor(midi/12)-1}</small>`:''}</span>`;keyboard.insertBefore(key,canvas);keys.push({midi,element:key,index:i})}whiteWidth=keys[0].element.getBoundingClientRect().width;for(let i=0;i<keys.length-1;i++){const a=keys[i].midi,b=keys[i+1].midi;if(b-a===2){const black=document.createElement('div');black.className='black';black.dataset.boundary=i+1;black.style.left=(4+(i+1)*whiteWidth)+'px';keyboard.insertBefore(black,canvas)}}canvas.width=Math.round(keyboard.getBoundingClientRect().width);canvas.height=Math.round(keyboard.getBoundingClientRect().height);canvas.style.width=canvas.width+'px';canvas.style.height=canvas.height+'px';ctx=canvas.getContext('2d');scroller.scrollLeft=0;$('position').value=0;$('nav').hidden=mode!=='all';showTask()}
function showTask(){const current=task(),matching=keys.filter(k=>nameOf(k.midi)===current.n);$('goal').innerHTML=`Pinta ${matching.length>1?'os':'o'} <em>${matching.length>1?names[current.n]+'s':names[current.n]}</em>!`;$('goal').style.setProperty('--goal',color(current.color).hex);$('paintIcon').style.setProperty('--goal',color(current.color).hex);$('dots').replaceChildren();for(const k of matching){const dot=document.createElement('span');dot.className='dot'+(painted.has(k.midi)?' done':'');$('dots').append(dot)}$('next').disabled=matching.some(k=>!painted.has(k.midi));$('next').textContent=index===options().length-1?'Outra vez ↻':'Próxima ➜';$('status').textContent=$('next').disabled?'🎨':'🌟 Muito bem! 🌟'}
function resetPaint(){ctx.clearRect(0,0,canvas.width,canvas.height);painted.clear();tracking.clear();showTask()}
function stamp(x,y){const i=Math.floor((x-4)/whiteWidth),k=keys[i],radius=mode==='all'?11:15;if(!k||x<4||y<1||y>244)return;const current=task(),valid=nameOf(k.midi)===current.n&&selected===current.color;ctx.save();ctx.beginPath();ctx.rect(4+i*whiteWidth+2,2,whiteWidth-4,232);ctx.clip();ctx.fillStyle=color(selected).hex;ctx.globalAlpha=.83;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();ctx.restore();if(!valid)return;let cells=tracking.get(k.midi);if(!cells){cells=new Set();tracking.set(k.midi,cells)}for(let cx=0;cx<8;cx++)for(let cy=0;cy<10;cy++){const px=4+i*whiteWidth+(cx+.5)*whiteWidth/8,py=8+(cy+.5)*22;if(Math.hypot(px-x,py-y)<radius+5)cells.add(cy*8+cx)}if(cells.size>=16&&!painted.has(k.midi)){painted.set(k.midi,true);sound(k.midi);showTask()}}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function stroke(e){const p=point(e),last=tracking.get('pointer:'+e.pointerId);if(last){const distance=Math.hypot(p.x-last.x,p.y-last.y),steps=Math.max(1,Math.ceil(distance/5));for(let j=1;j<=steps;j++)stamp(last.x+(p.x-last.x)*j/steps,last.y+(p.y-last.y)*j/steps)}else stamp(p.x,p.y);tracking.set('pointer:'+e.pointerId,p)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);tracking.set('pointer:'+e.pointerId,null);stroke(e)});canvas.addEventListener('pointermove',e=>{if(tracking.has('pointer:'+e.pointerId)){e.preventDefault();stroke(e)}});for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>tracking.delete('pointer:'+e.pointerId));
$('palette').innerHTML=colors.map(c=>`<button type="button" class="color" data-color="${c.id}" style="--color:${c.hex}" aria-label="Tinta ${c.name}" title="${c.name}"></button>`).join('');function selectColor(){document.querySelectorAll('.color').forEach(b=>b.classList.toggle('on',b.dataset.color===selected))}selectColor();$('palette').addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(!b)return;selected=b.dataset.color;selectColor()});document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;index=0;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));build()}));$('clear').addEventListener('click',resetPaint);$('next').addEventListener('click',()=>{if($('next').disabled)return;index=(index+1)%options().length;resetPaint()});$('left').addEventListener('click',()=>scroller.scrollBy({left:-scroller.clientWidth*.8,behavior:'smooth'}));$('right').addEventListener('click',()=>scroller.scrollBy({left:scroller.clientWidth*.8,behavior:'smooth'}));$('position').addEventListener('input',e=>scroller.scrollLeft=(scroller.scrollWidth-scroller.clientWidth)*Number(e.target.value)/100);scroller.addEventListener('scroll',()=>{const max=scroller.scrollWidth-scroller.clientWidth;$('position').value=max?Math.round(scroller.scrollLeft/max*100):0},{passive:true});window.addEventListener('resize',()=>{const width=keys[0]?.element.getBoundingClientRect().width;if(!width||Math.abs(width-whiteWidth)<.5)return;whiteWidth=width;keyboard.querySelectorAll('.black').forEach(b=>b.style.left=(4+Number(b.dataset.boundary)*whiteWidth)+'px');const old=ctx.getImageData(0,0,canvas.width,canvas.height);canvas.width=Math.round(keyboard.getBoundingClientRect().width);canvas.height=Math.round(keyboard.getBoundingClientRect().height);canvas.style.width=canvas.width+'px';canvas.style.height=canvas.height+'px';ctx=canvas.getContext('2d');ctx.putImageData(old,0,0)});document.addEventListener('contextmenu',e=>{if(e.target.closest('.game,.modes'))e.preventDefault()});build();
})();
</script></body></html>

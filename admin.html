<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Not Found</title><style>:root{--bg:#f7f8fb;--ink:#17191f;--muted:#747983;--line:#e6e8ee;--p:#6670f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:38px 16px 80px}.hidden{display:none!important}.gate{min-height:75vh;display:grid;place-items:center;text-align:center}.gate h1{font-size:30px;letter-spacing:-.05em}.gate p{color:var(--muted);font-size:12px}.head{display:flex;align-items:end;gap:12px;margin-bottom:16px}.head div{flex:1}.head small{color:var(--p);font-size:9px;font-weight:900;text-transform:uppercase}.head h1{margin:3px 0 0;font-size:34px;letter-spacing:-.05em}.head a{font-size:11px;font-weight:800;color:#646974}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.stat small{display:block;color:var(--muted);font-size:9px}.stat strong{font-size:24px}.panel{overflow:auto}.row{min-width:760px;display:grid;grid-template-columns:1.4fr 1.2fr .7fr .8fr 1.4fr;gap:8px;align-items:center;padding:10px;border-top:1px solid #eef0f4;font-size:10px}.row.headrow{border-top:0;color:#92969e;font-size:8px;font-weight:900;text-transform:uppercase}.name strong{display:block;font-size:11px}.name span{display:block;color:#92969e;font-size:9px}.status{font-weight:850}.actions{display:flex;gap:4px;flex-wrap:wrap}.actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;font-size:8px;font-weight:850}.actions button.danger{color:#a34f4f}.msg{font-size:10px;color:var(--muted);margin:8px 2px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main><section id="gate" class="gate"><div><h1>Página não encontrada.</h1><p>404</p></div></section><section id="consolePanel" class="hidden"><div class="head"><div><small>Luwipi</small><h1>Controlo privado</h1></div><a href="/app">Voltar ao Luwipi</a></div><div class="stats"><div class="stat"><small>Utilizadores</small><strong id="sUsers">—</strong></div><div class="stat"><small>Ativos</small><strong id="sActive">—</strong></div><div class="stat"><small>Em teste</small><strong id="sTrial">—</strong></div></div><div id="msg" class="msg"></div><div class="panel"><div class="row headrow"><div>Conta</div><div>Acesso</div><div>Função</div><div>Validade</div><div>Ações</div></div><div id="rows"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const gate=document.getElementById('gate'),panel=document.getElementById('consolePanel'),rows=document.getElementById('rows'),msg=document.getElementById('msg');try{const cfg=await(await fetch('/api/public-config',{cache:'no-store'})).json(),sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),session=(await sb.auth.getSession()).data.session;if(!session)return;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=v=>{if(!v||v==='—'||v==='sem limite')return v;const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('pt-PT')};async function api(method='GET',body){const current=(await sb.auth.getSession()).data.session;if(!current)throw 0;const r=await fetch('/api/admin/users',{method,headers:{authorization:'Bearer '+current.access_token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===404)throw 0;const data=await r.json();if(!r.ok)throw 0;return data}async function load(){const data=await api(),users=data.users||[];gate.classList.add('hidden');panel.classList.remove('hidden');document.title='Luwipi · Controlo';sUsers.textContent=users.length;sActive.textContent=users.filter(u=>u.access_status==='active'||u.role==='admin').length;sTrial.textContent=users.filter(u=>u.access_status==='trial').length;rows.innerHTML=users.map(u=>{const until=u.role==='admin'?'sem limite':(u.access_until||u.trial_ends_at||'—'),actions=u.role==='admin'?'—':'<div class="actions"><button data-id="'+u.id+'" data-action="grant30">+30d</button><button data-id="'+u.id+'" data-action="grant90">+90d</button><button data-id="'+u.id+'" data-action="trial24">24h</button><button class="danger" data-id="'+u.id+'" data-action="block">Bloquear</button></div>';return '<div class="row"><div class="name"><strong>'+esc(u.full_name||'Professor')+'</strong><span>'+esc(u.email||u.id)+'</span></div><div class="status">'+esc(u.access_status||'—')+'</div><div>'+esc(u.role||'teacher')+'</div><div>'+esc(fmt(until))+'</div><div>'+actions+'</div></div>'}).join('');rows.querySelectorAll('button[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;msg.textContent='A atualizar…';try{await api('PATCH',{id:b.dataset.id,action:b.dataset.action});msg.textContent='Atualizado.';await load()}catch{msg.textContent='Não foi possível atualizar.'}finally{b.disabled=false}})}await load()}catch(e){console.error(e)}})();
</script></body></html>

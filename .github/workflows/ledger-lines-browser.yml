name: Ledger Lines Browser Regression
on:
  push:
    branches: [fix/visible-ledger-lines-reading]
  pull_request:
permissions:
  contents: read
jobs:
  ledger-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Existing reliability gate
        run: sh scripts/build-static.sh
      - run: npm install --no-save playwright@1.55.1
      - name: Serve the built site
        run: python3 -m http.server 4173 --directory public > /tmp/luwipi-ledger.log 2>&1 &
      - name: Browser-verify supplementary lines on desktop and mobile
        run: node scripts/ledger-lines-browser-check.mjs
      - name: Retain screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-lines-screenshots
          path: /tmp/ledger-*.png
          if-no-files-found: ignore

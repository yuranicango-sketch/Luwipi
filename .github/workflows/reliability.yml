name: Luwipi Reliability

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Full quality gate (reading, pedagogy and static assets)
        run: sh scripts/build-static.sh

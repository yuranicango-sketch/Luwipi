name: Short Pattern Browser Regression
on:
  push:
    branches: [fix/short-pattern-score-audio-sync]
  pull_request:
permissions:
  contents: read
jobs:
  pattern:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sh scripts/build-static.sh
      - run: npm install --no-save playwright@1.55.1
      - name: Serve local app
        run: python3 -m http.server 4173 --directory public > /tmp/luwipi-pattern.log 2>&1 &
      - name: Confirm two-bar notation and playback in the browser
        run: node scripts/short-pattern-browser-check.mjs

<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luwipi — A entrar</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
html,body{margin:0;min-height:100%;background:#f7f8fb;color:#17191f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(100%,390px);background:#fff;border:1px solid #e6e8ee;border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 50px rgba(24,26,34,.09)}
.logo{width:40px;height:40px;margin:auto;border-radius:13px;background:#6670f5;color:#fff;display:grid;place-items:center;font-weight:900}
h1{font-size:26px;letter-spacing:-.04em;margin:14px 0 7px}
p{font-size:12px;line-height:1.5;color:#777b85}
button{border:0;border-radius:12px;background:#6670f5;color:#fff;padding:11px 14px;font-weight:850}
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="logo">L</div>
    <h1 id="title">A concluir a entrada…</h1>
    <p id="message">Só um instante.</p>
    <button id="retry" hidden>Voltar ao início</button>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
  const title=document.getElementById('title');
  const message=document.getElementById('message');
  const retry=document.getElementById('retry');
  retry.onclick=()=>location.replace('/');
  try{
    const cfgResponse=await fetch('/api/public-config',{cache:'no-store'});
    if(!cfgResponse.ok)throw new Error('config');
    const cfg=await cfgResponse.json();
    const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{
      auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
    const params=new URLSearchParams(location.search);
    const oauthError=params.get('error_description')||params.get('error');
    if(oauthError)throw new Error(oauthError);
    const code=params.get('code');
    if(code){
      const result=await client.auth.exchangeCodeForSession(code);
      if(result.error)throw result.error;if(result.data&&result.data.session&&result.data.session.provider_token)sessionStorage.setItem('luwipi_google_provider_token',result.data.session.provider_token);
    }else{
      await new Promise(resolve=>setTimeout(resolve,100));
      const result=await client.auth.getSession();
      if(result.error||!result.data.session)throw result.error||new Error('session_missing');
    }
    location.replace('/app?auth=complete');
  }catch(error){
    console.error(error);
    title.textContent='Não foi possível entrar.';
    message.textContent='Volta ao Luwipi e tenta novamente com a conta Google.';
    retry.hidden=false;
  }
})();
</script>
</body>
</html>
